# ניסוי: טיפול בסימני פיסוק בקול של נועם (VoxCPM2). רץ רק ב־branch הניסוי, ושומר את הדוגמאות בו.
name: VoxCPM punctuation

on:
  push:
    branches: [ccr-6468bada-0q6qyg]
    paths:
      - tools/voxcpm_punct.py
      - tools/voices/**
      - .github/workflows/voxcpm-punct.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voxcpm2-model-v1

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install VoxCPM (CPU)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm

      - run: python3 tools/voxcpm_punct.py

      - name: Commit samples
        if: always()
        run: |
          git add samples/voxcpm-punct || true
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add VoxCPM2 punctuation samples"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
