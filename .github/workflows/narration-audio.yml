# יוצר את קבצי השמע של ההקראה (audio/) בעזרת tools/generate_audio.py,
# בכל פעם שהטקסטים או הסקריפט משתנים, ומעלה אותם חזרה למאגר.
name: Narration audio

on:
  push:
    paths:
      - js/data.js
      - js/glossary.js
      - js/speech.js
      - tools/**
      - .github/workflows/narration-audio.yml
  workflow_dispatch:
  # פעם בשבוע בודקים שוב: אם edge-tts חזר לעבוד, הקבצים נוצרים מחדש בקול שלו
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: narration-audio
  cancel-in-progress: false

jobs:
  generate:
    # בדחיפה – רק ב־branch הראשי, שממנו האתר מתפרסם. הרצה ידנית אפשרית בכל branch.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: .cache/tts-models
          key: tts-models-v1

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - run: pip install -r tools/requirements-audio.txt

      - run: python3 tools/generate_audio.py

      - name: Commit audio
        run: |
          git add audio
          if git diff --cached --quiet; then
            echo "אין שינויים בקבצי השמע."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update narration audio"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
