# ניסוי: קטלוג קולות לנועם מ־VoxCPM2. רץ רק ב־branch הניסוי, ושומר את הדוגמאות בו.
name: VoxCPM catalog

on:
  push:
    branches: [ccr-6468bada-0q6qyg]
    paths:
      - tools/voxcpm_catalog.py
      - .github/workflows/voxcpm-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: voxcpm2-model-v1

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install VoxCPM (CPU)
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install voxcpm

      - run: python3 tools/voxcpm_catalog.py

      - name: Commit samples
        if: always()
        run: |
          [ -d samples/voxcpm-catalog ] || exit 0
          # הדוגמאות החדשות גוברות על קבצים קודמים באותו שם, בלי קונפליקטים
          cp -r samples/voxcpm-catalog "$RUNNER_TEMP/out"
          git fetch origin "$GITHUB_REF_NAME"
          git reset -q --hard "origin/$GITHUB_REF_NAME"
          mkdir -p samples/voxcpm-catalog && cp -r "$RUNNER_TEMP/out/." samples/voxcpm-catalog/
          git add samples/voxcpm-catalog
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add VoxCPM2 voice catalog"
          git push origin "HEAD:$GITHUB_REF_NAME"
